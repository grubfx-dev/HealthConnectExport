[versions]
agp = "9.4.1"
connectClient = "1.1.0"
datastorePreferences = "1.3.0"
gson = "2.15.0"
kotlin = "2.2.10"
coreKtx = "1.19.1"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"

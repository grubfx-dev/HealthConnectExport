name: Android Release

on:
  push:
    branches:
      - development
  workflow_dispatch:

env:
  JAVA_VERSION: '17'
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2048m"

jobs:
  build-and-release:
    name: Build APK and Create Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate Version
        id: version
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$LAST_TAG" ]; then
            COMMIT_COUNT=$(git rev-list --count HEAD)
          else
            COMMIT_COUNT=$(git rev-list --count ${LAST_TAG}..HEAD)
          fi
          DATE_PART=$(date +%Y.%m.%d)
          VERSION="${DATE_PART}.${COMMIT_COUNT}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "📦 Version: $VERSION"

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          cache-read-only: false

      - name: Decode Keystore
        env:
          ENCODED_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$ENCODED_KEYSTORE" ]; then
            echo "$ENCODED_KEYSTORE" | base64 -d > keystore.jks
          else
            echo "⚠️ No keystore"
            keytool -genkeypair -v -keystore keystore.jks -storepass android \
              -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Debug" 2>/dev/null || true
          fi

      - name: Create local.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cat > local.properties <<EOF2
          storeFile=keystore.jks
          storePassword=\${KEYSTORE_PASSWORD:-android}
          keyAlias=\${KEY_ALIAS:-androiddebugkey}
          keyPassword=\${KEY_PASSWORD:-android}
          EOF2

      - name: Update Version
        run: |
          sed -i "s/versionName=.*/versionName=${{ steps.version.outputs.version }}/" gradle.properties
          echo "✅ Version: ${{ steps.version.outputs.version }}"

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Run Tests
        run: ./gradlew testDebugUnitTest --stacktrace || true

      - name: Sign APK
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: '34.0.0'

      - name: Find APK
        id: find_apk
        run: |
          if [ -f "${{ steps.sign_app.outputs.signedReleaseFile }}" ]; then
            APK_PATH="${{ steps.sign_app.outputs.signedReleaseFile }}"
          else
            APK_PATH=$(ls app/build/outputs/apk/release/*.apk | head -1)
          fi
          echo "APK_PATH=$APK_PATH" >> $GITHUB_OUTPUT
          echo "✅ APK: $(basename $APK_PATH)"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Release ${{ steps.version.outputs.version }}
          body: |
            ## 🚀 Health Connect Export ${{ steps.version.outputs.version }}
            - Health Connect data export to InfluxDB
            - Automatic background sync (24h)
            - Steps, calories, sleep tracking
          files: ${{ steps.find_apk.outputs.APK_PATH }}
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: health-connect-export-${{ steps.version.outputs.version }}
          path: ${{ steps.find_apk.outputs.APK_PATH }}

      - name: Create Tag
        uses: rickstaa/action-create-tag@v1
        with:
          tag: ${{ steps.version.outputs.version }}
          message: "Release ${{ steps.version.outputs.version }}"
          github_token: ${{ secrets.GITHUB_TOKEN }}

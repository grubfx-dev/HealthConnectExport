name: Android Release

on:
  push:
    branches:
      - development
  workflow_dispatch:

env:
  JAVA_VERSION: '17'

jobs:
  build-and-release:
    name: Build APK and Create Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Calculate Version
        id: version
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$LAST_TAG" ]; then
            COMMIT_COUNT=$(git rev-list --count HEAD)
          else
            COMMIT_COUNT=$(git rev-list --count ${LAST_TAG}..HEAD)
          fi
          DATE_PART=$(date +%Y.%m.%d)
          VERSION="${DATE_PART}.${COMMIT_COUNT}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper

      - name: Setup Keystore
        env:
          ENCODED_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$ENCODED_KEYSTORE" ]; then
            echo "$ENCODED_KEYSTORE" | base64 -d > keystore.jks
          else
            echo "No keystore, using debug"
            keytool -genkeypair -v -keystore keystore.jks \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Debug" 2>/dev/null || true
          fi

      - name: Create local.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cat > local.properties <<'EOF2'
          storeFile=keystore.jks
          storePassword=${KEYSTORE_PASSWORD:-android}
          keyAlias=${KEY_ALIAS:-androiddebugkey}
          keyPassword=${KEY_PASSWORD:-android}
          EOF2

      - name: Update Version
        run: |
          sed -i "s/versionName=.*/versionName=${{ steps.version.outputs.version }}/" gradle.properties
          echo "Version: ${{ steps.version.outputs.version }}"

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Run Tests
        run: ./gradlew testDebugUnitTest --stacktrace || true

      - name: Sign APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          APK_UNSIGNED=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          if [ -f keystore.jks ]; then
            echo "Signing APK with keystore..."
            jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
              -keystore keystore.jks -storepass "${KEYSTORE_PASSWORD:-android}" \
              -keypass "${KEY_PASSWORD:-android}" \
              "$APK_UNSIGNED" "${KEY_ALIAS:-androiddebugkey}"
          else
            echo "No keystore, using unsigned APK"
          fi

      - name: Find APK
        id: find_apk
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          echo "APK_PATH=$APK_PATH" >> $GITHUB_OUTPUT
          echo "APK_NAME=$(basename $APK_PATH)" >> $GITHUB_OUTPUT
          echo "APK: $(basename $APK_PATH)"
          ls -lh "$APK_PATH"

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.version }}"
          APK_PATH="${{ steps.find_apk.outputs.APK_PATH }}"
          echo "Creating release: $TAG"
          echo "Release $TAG" > /tmp/release_notes.txt
          echo "" >> /tmp/release_notes.txt
          echo "### Features" >> /tmp/release_notes.txt
          echo "- Health Connect data export to InfluxDB" >> /tmp/release_notes.txt
          echo "- Automatic background sync (24h)" >> /tmp/release_notes.txt
          echo "- Steps, calories, sleep tracking" >> /tmp/release_notes.txt
          echo "" >> /tmp/release_notes.txt
          echo "### Changelog" >> /tmp/release_notes.txt
          echo "See CHANGELOG.md" >> /tmp/release_notes.txt
          gh release create "$TAG" "$APK_PATH" \
            --title "Release $TAG" \
            --notes-file /tmp/release_notes.txt \
            --verify-tag
          echo "Release created: https://github.com/grubfx-dev/HealthConnectExport/releases/tag/$TAG"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: health-connect-export-${{ steps.version.outputs.version }}
          path: ${{ steps.find_apk.outputs.APK_PATH }}

      - name: Create Tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.version }}"
          echo "Creating tag: $TAG"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"
          echo "Tag pushed: $TAG"

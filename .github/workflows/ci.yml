name: Android Release

on:
  push:
    branches:
      - main
      - development
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Calculate Semantic Version
        id: version
        uses: paulhatch/semantic-version@v5.4.0
        with:
          tag_prefix: "v"
          major_pattern: "/!:|BREAKING CHANGE:/"
          minor_pattern: "/feat(\\(.+\\))?:/"
          version_format: "${major}.${minor}.${patch}"
          bump_each_commit: false

      - name: Decode release keystore
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "Keystore written to $RUNNER_TEMP/release.jks"

      - name: Build Release APK
        env:
          HECEXP_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          HECEXP_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          HECEXP_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          HECEXP_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ steps.version.outputs.version_tag }}
          path: app/build/outputs/apk/release/app-release.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version_tag }}
          name: Release v${{ steps.version.outputs.version_tag }}
          prerelease: ${{ github.ref == 'refs/heads/development' }}
          files: app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
          token: ${{ secrets.GITHUB_TOKEN }}
